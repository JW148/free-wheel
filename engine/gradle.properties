# Homebrew's openjdk@21 is keg-only, so it lives outside every location Gradle
# auto-detects. Registering it here lets the Java toolchain (21, see build.gradle)
# resolve even if Gradle itself was launched from a different JVM.
#
# Harmless if the path is absent — Gradle logs and moves on to the next candidate.
org.gradle.java.installations.paths=/opt/homebrew/opt/openjdk@21/libexec/openjdk.jdk/Contents/Home

org.gradle.jvmargs=-Xmx1536m
